# Правило 7 дней: если по задаче с исполнителем 7 дней нет движения
# (ни в issue, ни в связанном PR), исполнитель снимается, задача снова свободна.
name: Release stale assignments

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

jobs:
  unassign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const DAYS = 7;
            const now = Date.now();
            const { owner, repo } = context.repo;

            // Последняя активность по каждой задаче в открытых PR ("Closes #12" в описании).
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const prActivity = {};
            for (const pr of prs) {
              const re = /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
              for (const m of (pr.body || '').matchAll(re)) {
                const n = Number(m[3]);
                prActivity[n] = Math.max(prActivity[n] || 0, Date.parse(pr.updated_at));
              }
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', assignee: '*', per_page: 100 });
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const last = Math.max(Date.parse(issue.updated_at), prActivity[issue.number] || 0);
              const idleDays = (now - last) / 86400000;
              if (idleDays < DAYS) continue;

              const logins = issue.assignees.map(a => a.login);
              await github.rest.issues.removeAssignees({ owner, repo, issue_number: issue.number, assignees: logins });
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['help wanted'] });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `${logins.map(l => '@' + l).join(', ')}, по задаче ${DAYS} дней не было движения — снимаю исполнителя, задача снова свободна. ` +
                      `Если работа есть — открой draft PR со ссылкой на задачу и возьми её снова. Наработки из PR может продолжить любой.`,
              });
              core.info(`#${issue.number}: снят ${logins.join(', ')} (${Math.floor(idleDays)} дн. без движения)`);
            }
